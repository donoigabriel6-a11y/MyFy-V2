<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>MyFy – Premium Music Player</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://www.youtube.com/iframe_api"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.google.com/recaptcha/api.js" async defer></script>

  <style>
    :root {
      --bg-main: #0a0a0a;
      --bg-elevated: #1a1a1a;
      --bg-hover: #2a2a2a;
      --accent: #ff0000;
      --accent-soft: #f97316;
      --text-primary: #ffffff;
      --text-secondary: #a0a0a0;
      --border-subtle: rgba(255, 255, 255, 0.1);
      --glass: rgba(15, 15, 15, 0.85);
    }

    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Inter", sans-serif; background: var(--bg-main); color: var(--text-primary); overflow: hidden; }

    .app {
      display: grid; grid-template-rows: auto 1fr auto; height: 100vh;
      background: radial-gradient(circle at top left, var(--accent) 0%, transparent 30%),
                  radial-gradient(circle at bottom right, var(--accent-soft) 0%, transparent 30%),
                  var(--bg-main);
    }

    header.top {
      display: flex; align-items: center; justify-content: space-between; padding: 12px 24px;
      background: var(--glass); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border-subtle); z-index: 50;
    }

    .logo-area { display: flex; align-items: center; gap: 10px; }
    .logo-dot {
      width: 34px; height: 34px; border-radius: 10px; background: linear-gradient(135deg, #fff, var(--accent));
      display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 18px; color: #000;
    }
    .brand { font-weight: 800; letter-spacing: -0.02em; font-size: 20px; }

    .nav-tabs { display: flex; gap: 6px; background: rgba(0,0,0,0.4); border-radius: 14px; padding: 4px; }
    .nav-tab {
      border: none; border-radius: 10px; padding: 8px 18px; font-size: 14px; font-weight: 600;
      background: transparent; color: var(--text-secondary); cursor: pointer;
    }
    .nav-tab.active { background: #fff; color: #000; }

    .search-bar {
      display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,0.05);
      border-radius: 12px; padding: 6px 15px; border: 1px solid var(--border-subtle);
    }
    .search-bar input { border: none; outline: none; background: transparent; color: #fff; width: 180px; font-size: 14px; }

    .layout { display: grid; grid-template-columns: 1fr 320px; gap: 20px; padding: 20px 24px; overflow: hidden; }
    .main-pane { overflow-y: auto; padding-right: 8px; }
    .side-pane {
      background: var(--glass); backdrop-filter: blur(10px); border-radius: 16px;
      padding: 20px; border: 1px solid var(--border-subtle); display: flex; flex-direction: column; gap: 15px;
    }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 20px; padding-bottom: 40px; }
    .card {
      background: var(--bg-elevated); border-radius: 14px; padding: 12px; cursor: pointer;
      position: relative; transition: 0.2s ease-out; border: 1px solid transparent;
    }
    .card:hover { background: var(--bg-hover); transform: translateY(-4px); border-color: var(--border-subtle); }
    .thumb { 
      border-radius: 10px; aspect-ratio: 16/9; margin-bottom: 12px; overflow: hidden;
      background: #222; display: flex; align-items: center; justify-content: center;
    }
    .thumb img { width: 100%; height: 100%; object-fit: cover; }
    
    .play-fab {
      position: absolute; right: 16px; bottom: 60px; width: 42px; height: 42px;
      border-radius: 50%; background: var(--accent); display: flex; align-items: center; justify-content: center;
      opacity: 0; transform: translateY(10px); transition: 0.2s;
    }
    .card:hover .play-fab { opacity: 1; transform: translateY(0); }

    .auth-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.95); backdrop-filter: blur(15px);
      display: flex; align-items: center; justify-content: center; z-index: 100;
    }
    .auth-card {
      width: 400px; background: #111; border-radius: 28px; padding: 40px; border: 1px solid #333;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }
    .pill {
      border-radius: 12px; border: 1px solid #333; background: transparent; color: #fff;
      padding: 12px; font-size: 14px; font-weight: 600; cursor: pointer; width: 100%; margin-bottom: 10px;
    }
    .pill.solid { background: var(--accent); border: none; }
    .auth-input { background: #181818; border: 1px solid #333; color: #fff; padding: 12px; border-radius: 10px; width: 100%; margin-bottom: 10px; outline: none; }

    footer.player {
      display: grid; grid-template-columns: 300px 1fr 300px; align-items: center;
      padding: 16px 32px; background: var(--glass); backdrop-filter: blur(25px); border-top: 1px solid var(--border-subtle);
    }
    .bar { flex: 1; height: 6px; border-radius: 10px; background: rgba(255,255,255,0.1); position: relative; cursor: pointer; }
    .bar-fill { height: 100%; background: var(--accent); border-radius: 10px; width: 0%; transition: width 0.1s linear; }

    #ytPlayerWrapper {
      position: fixed; bottom: 100px; left: 24px; width: 320px; height: 0; opacity: 0;
      border-radius: 16px; overflow: hidden; transition: 0.3s; pointer-events: none;
    }
    #ytPlayerWrapper.show { height: 180px; opacity: 1; pointer-events: auto; }
  </style>
</head>
<body>

  <div class="auth-overlay" id="authOverlay">
    <div class="auth-card">
      <div class="brand" style="text-align:center; font-size:28px; margin-bottom:8px;">MyFy</div>
      <p style="text-align:center; color:var(--text-secondary); font-size:14px; margin-bottom:30px;">Sign in to unlock library and search features.</p>
      <div class="nav-tabs" style="margin-bottom:24px;">
        <button id="loginTab" class="nav-tab active" style="flex:1">Log in</button>
        <button id="signupTab" class="nav-tab" style="flex:1">Sign up</button>
      </div>
      <div class="auth-form">
        <button class="pill" id="googleBtn">Continue with Google</button>
        <button class="pill" id="githubBtn">Continue with GitHub</button>
        <div style="display:flex; align-items:center; gap:10px; margin:20px 0;"><hr style="flex:1; border:0; border-top:1px solid #333;"><span style="font-size:12px; color:#666;">OR EMAIL</span><hr style="flex:1; border:0; border-top:1px solid #333;"></div>
        <input type="email" id="authEmail" placeholder="Email address" class="auth-input">
        <input type="password" id="authPassword" placeholder="Password" class="auth-input">
        <div id="authError" style="color:#ff4444; font-size:12px; margin-bottom:12px; min-height:15px;"></div>
        <div class="g-recaptcha" data-sitekey="6Ler4icsAAAAAOa9mOF-wxVRLBIaVGQiN5LL_BTA" data-callback="onCaptchaSuccess" style="margin-bottom:20px; transform:scale(0.9); transform-origin:left;"></div>
        <button class="pill solid" id="authSubmit">Continue</button>
      </div>
    </div>
  </div>

  <div class="app">
    <header class="top">
      <div class="logo-area"><div class="logo-dot">▶</div><div class="brand">MyFy</div></div>
      <div class="nav-tabs">
        <button class="nav-tab active" data-tab="featured">Featured</button>
        <button class="nav-tab" data-tab="search">Search</button>
        <button class="nav-tab" data-tab="library">Library</button>
      </div>
      <div class="top-right" style="display:flex; align-items:center; gap:15px;">
        <form id="searchForm" class="search-bar" style="display:none;">
          <input id="searchInput" type="text" placeholder="Search YouTube..." />
          <button type="submit" style="background:none; border:none; color:white; cursor:pointer;">🔍</button>
        </form>
        <span id="welcomeLabel" style="font-size:13px; font-weight:600;">Welcome</span>
        <button class="pill" id="logoutBtn" style="width:auto; padding:6px 15px; margin:0; display:none;">Log out</button>
      </div>
    </header>

    <div class="layout">
      <main class="main-pane">
        <section id="featuredSection">
          <h1 style="font-size: 32px; font-weight: 800; margin-bottom: 5px;">Featured Tracks</h1>
          <p style="color:var(--text-secondary); margin-bottom:25px;">Hand-picked hits and community favorites.</p>
          <div class="grid" id="featuredGrid"></div>
        </section>
        <section id="searchSection" style="display:none;">
          <h1 style="font-size: 32px; font-weight: 800; margin-bottom: 20px;">Search Results</h1>
          <div class="grid" id="resultsGrid"></div>
        </section>
        <section id="librarySection" style="display:none;">
          <h1 style="font-size: 32px; font-weight: 800; margin-bottom: 20px;">Your Library</h1>
          <div class="grid" id="libraryGrid"></div>
        </section>
      </main>
      <aside class="side-pane">
        <h3 style="margin:0; font-size:18px;">Track Details</h3>
        <div id="lyricsBody" style="background:rgba(0,0,0,0.2); padding:15px; border-radius:12px; font-size:14px; line-height:1.6; flex:1; overflow-y:auto; white-space:pre-line;">Select a song to see info.</div>
      </aside>
    </div>

    <footer class="player">
      <div class="player-left" style="display:flex; align-items:center; gap:12px;">
        <div id="playerThumb" class="player-thumb" style="width:50px; height:50px; border-radius:8px; background:#222; overflow:hidden;"></div>
        <div style="min-width:0;"><div id="playerTitle" style="font-weight:700; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">Nothing playing</div><div id="playerArtist" style="font-size:12px; color:var(--text-secondary);">Choose a track</div></div>
      </div>
      <div class="player-center" style="display:flex; flex-direction:column; align-items:center; gap:8px;">
        <div style="display:flex; gap:25px; font-size:20px; cursor:pointer; align-items:center;"><span id="prevBtn">⏮</span><span id="playBtn" style="background:var(--accent); width:40px; height:40px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:16px;">▶</span><span id="nextBtn">⏭</span></div>
        <div style="display:flex; align-items:center; gap:10px; width:100%; font-size:11px; color:var(--text-secondary);"><span id="timeCurrent">0:00</span><div class="bar" id="progressBar"><div class="bar-fill" id="progressFill"></div></div><span id="timeTotal">0:00</span></div>
      </div>
      <div class="player-right" style="display:flex; justify-content:flex-end; align-items:center; gap:15px;"><button id="saveBtn" style="background:none; border:none; color:white; cursor:pointer; font-size:20px;">♡</button><button class="pill" id="toggleVideoBtn" style="width:auto; padding:5px 12px; font-size:11px; margin:0;">Show Video</button></div>
    </footer>
  </div>

  <div id="ytPlayerWrapper"><div id="ytPlayer"></div></div>

  <script>
    const YT_API_KEY = "AIzaSyCAI5uYDCGWGP_2NyUpkzTe4B-FzO0wmPo";
    const firebaseConfig = { apiKey: "AIzaSyCWQvsuaaNpNWSNr8PmI9IMt8dC7hyaxu8", authDomain: "my-fy-ac0eb.firebaseapp.com", projectId: "my-fy-ac0eb", storageBucket: "my-fy-ac0eb.appspot.com", messagingSenderId: "619474074736", appId: "1:619474074736:web:b56a4b08c0ad16342ec8b5" };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    const featuredTracks = [
      { id:"l1", kind:"local", src:"Golden By HUNTERX.mp3", title:"Golden", artist:"HUNTERX", videoId:"dQw4w9WgXcQ" },
      { id:"l2", kind:"local", src:"d4vd - Romantic Homicide.mp3", title:"Romantic Homicide", artist:"d4vd", thumb:"https://i.ytimg.com/vi/tPEE9ZwTmy0/mqdefault.jpg", videoId:"tPEE9ZwTmy0" },
      { id:"l3", kind:"local", src:"Crab Rave By Noisestorm.mp3", title:"Crab Rave", artist:"Noisestorm", thumb:"https://i.ytimg.com/vi/LDU_Txk06tM/mqdefault.jpg", videoId:"LDU_Txk06tM" },
      { id:"l4", kind:"local", src:"Melly Mike - Young Black & Rich (Official Music Video).mp3", title:"Young Black & Rich", artist:"Melly Mike", videoId:"QY6GqXc0w7E" },
      { id:"l5", kind:"local", src:"d4vd - Feel It (Official Music Video).mp3", title:"Feel It", artist:"d4vd", videoId:"2nGsig_y3pA" }
    ];

    let currentList = [], currentIndex = -1, currentSource = null, audioPlayer = new Audio(), ytPlayer = null, captchaVerified = false, authMode = "login";

    window.onCaptchaSuccess = () => { captchaVerified = true; document.getElementById("authError").textContent = ""; };
    auth.onAuthStateChanged(user => {
      const overlay = document.getElementById("authOverlay");
      if (user) { overlay.style.display = "none"; document.getElementById("logoutBtn").style.display = "block"; document.getElementById("welcomeLabel").textContent = "Hi, " + (user.displayName || user.email.split('@')[0]); }
      else { overlay.style.display = "flex"; document.getElementById("logoutBtn").style.display = "none"; document.getElementById("welcomeLabel").textContent = "Welcome, guest"; }
    });

    document.getElementById("googleBtn").onclick = () => auth.signInWithPopup(new firebase.auth.GoogleAuthProvider());
    document.getElementById("githubBtn").onclick = () => auth.signInWithPopup(new firebase.auth.GithubAuthProvider());
    document.getElementById("logoutBtn").onclick = () => auth.signOut();

    document.getElementById("authSubmit").onclick = () => {
      const email = document.getElementById("authEmail").value, pass = document.getElementById("authPassword").value, err = document.getElementById("authError");
      if (!captchaVerified) { err.textContent = "Complete reCAPTCHA"; return; }
      if (authMode === "login") auth.signInWithEmailAndPassword(email, pass).catch(e => err.textContent = e.message);
      else auth.createUserWithEmailAndPassword(email, pass).then(c => { c.user.sendEmailVerification(); alert("Verify your email!"); }).catch(e => err.textContent = e.message);
    };

    async function searchYouTube(term) {
      const grid = document.getElementById("resultsGrid"); grid.innerHTML = "<p>Searching...</p>";
      try {
        const res = await fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&maxResults=20&q=${encodeURIComponent(term)}&key=${YT_API_KEY}`);
        const data = await res.json();
        const list = data.items.map(i => ({ id: i.id.videoId, kind: "yt", videoId: i.id.videoId, title: i.snippet.title, artist: i.snippet.channelTitle, thumb: i.snippet.thumbnails.medium.url }));
        renderGrid("resultsGrid", list, "search");
      } catch (e) { grid.innerHTML = "<p>Error loading results.</p>"; }
    }

    document.getElementById("searchForm").onsubmit = (e) => { e.preventDefault(); searchYouTube(document.getElementById("searchInput").value); };

    function playFromIndex(index, list) {
      currentList = list; currentIndex = index; const track = list[index];
      document.getElementById("playerTitle").textContent = track.title; document.getElementById("playerArtist").textContent = track.artist;
      document.getElementById("playerThumb").innerHTML = track.thumb ? `<img src="${track.thumb}">` : `<div style="padding:15px;">🎵</div>`;
      audioPlayer.pause(); if (ytPlayer && ytPlayer.stopVideo) ytPlayer.stopVideo();
      if (track.kind === "local") { currentSource = "local"; audioPlayer.src = track.src; audioPlayer.play(); }
      else {
        currentSource = "yt";
        if (!ytPlayer) { ytPlayer = new YT.Player("ytPlayer", { videoId: track.videoId, events: { onStateChange: (e) => { if(e.data === YT.PlayerState.ENDED) playNext(); } } }); }
        else { ytPlayer.loadVideoById(track.videoId); }
      }
      document.getElementById("playBtn").textContent = "⏸";
    }

    function renderGrid(id, list, type) {
      const grid = document.getElementById(id); grid.innerHTML = "";
      list.forEach((t, i) => {
        const card = document.createElement("div"); card.className = "card";
        card.innerHTML = `<div class="thumb">${t.thumb ? `<img src="${t.thumb}">` : '🎵'}</div><div class="card-title" style="font-weight:600; font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${t.title}</div><div style="font-size:12px; color:var(--text-secondary);">${t.artist}</div><div class="play-fab">▶</div>`;
        card.onclick = () => playFromIndex(i, list);
        grid.appendChild(card);
      });
    }

    document.querySelectorAll(".nav-tab").forEach(btn => {
      btn.onclick = () => {
        if (!btn.dataset.tab) return;
        document.querySelectorAll(".nav-tab").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        document.querySelectorAll("main section").forEach(s => s.style.display = "none");
        document.getElementById(btn.dataset.tab + "Section").style.display = "block";
        document.getElementById("searchForm").style.display = btn.dataset.tab === "search" ? "flex" : "none";
      };
    });

    setInterval(() => {
      let cur = 0, dur = 0;
      if (currentSource === "local") { cur = audioPlayer.currentTime; dur = audioPlayer.duration; }
      else if (currentSource === "yt" && ytPlayer && ytPlayer.getDuration) { cur = ytPlayer.getCurrentTime(); dur = ytPlayer.getDuration(); }
      if (dur) { document.getElementById("progressFill").style.width = (cur / dur * 100) + "%"; document.getElementById("timeCurrent").textContent = Math.floor(cur/60) + ":" + ("0"+Math.floor(cur%60)).slice(-2); document.getElementById("timeTotal").textContent = Math.floor(dur/60) + ":" + ("0"+Math.floor(dur%60)).slice(-2); }
    }, 500);

    document.getElementById("toggleVideoBtn").onclick = () => document.getElementById("ytPlayerWrapper").classList.toggle("show");
    renderGrid("featuredGrid", featuredTracks, "featured");
  </script>
</body>
</html>
